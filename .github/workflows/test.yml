name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Herdr 0.9.0
        run: |
          curl -fL --retry 3 https://github.com/herdrdev/herdr/releases/download/v0.9.0/herdr-linux-x86_64 -o "$RUNNER_TEMP/herdr"
          echo "4fa1a01158dd8043da92d31b270780b0dcc10603038d9b61cac4d81ab63fb71f  $RUNNER_TEMP/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/herdr"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.85.0
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/tmax .
      - run: node --test tests/*.test.mjs
        env:
          TMAX_BENCH: '1'
      - run: node benchmarks/local.mjs
        env:
          TMAX_REPEATS: '2'
